<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Voxel Block Arena</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none}body{overflow:hidden;background:#111;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}
    #crosshair{position:fixed;z-index:10;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}#crosshair:before{left:0;top:8px;width:18px;height:2px}#crosshair:after{left:8px;top:0;width:2px;height:18px}
    #hud{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;border:1px solid #ffffff26;border-radius:10px;background:#0f172abf}.slot{width:52px;height:52px;border:2px solid #ffffff40;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;background:#0006}.slot.active{border-color:#38bdf8;background:#38bdf840;transform:translateY(-3px)}.swatch{width:22px;height:22px;margin-bottom:3px;border:1px solid #0008;border-radius:3px}
    #overlay{position:fixed;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f8fafc;background:#0a0f1cd1}#overlay h1{font-size:2rem;margin-bottom:10px}#overlay p{max-width:480px;margin-bottom:20px;color:#cbd5e1;line-height:1.5}#startBtn{padding:12px 28px;border:0;border-radius:8px;background:#38bdf8;color:#0f172a;font-size:1rem;font-weight:700;cursor:pointer}#stats{position:fixed;z-index:10;top:12px;left:14px;padding:6px 10px;border-radius:6px;background:#0f172aa6;color:#e2e8f0;font-size:12px;pointer-events:none}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="stats">FPS: -- | Blocks: -- | Pos: 0, 0, 0</div>
  <div id="crosshair"></div>
  <div id="hud"></div>
  <div id="overlay"><h1>3D Voxel Block Arena</h1><p><strong>WASD</strong> Move · <strong>Space</strong> Jump · <strong>Shift</strong> Sprint<br><strong>Left Click</strong> Break · <strong>Right Click</strong> Place · <strong>1–5</strong> Select Block</p><button id="startBtn">Click to Enter Arena</button></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
